# Publishes the core and the hosts on crates.io, each at the version in its
# Cargo.toml, the core first, and tags each published crate's commit
# <crate>-v<version>. A crate whose version is on crates.io already is
# skipped, so a run after one that stopped halfway publishes the rest. Each
# host is its own workspace, so the hosts' versions of the core are bumped by
# hand with the core's. GPUI's host isn't published, since it builds on a
# changed GPUI.
#
# Then it stages Exact's host, the package in exact/package, on npm as
# maplibre-exact, with the build's provenance, unless its version is there
# already, and tags it maplibre-exact-v<version>. A maintainer publishes the
# staged version with 2FA, with `npm stage approve` or on npmjs.com.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The mln-rs release ci.yml builds against.
  MLN_RS: v0.0.12
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          path: maplibre-rust-ui
      - uses: actions/checkout@v7
        with:
          repository: louwers/mln-rs
          ref: ${{ env.MLN_RS }}
          path: mln-rs
      - name: Publish
        working-directory: maplibre-rust-ui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in core slint egui bevy nsh whisker; do
            name=$(grep -m1 '^name = ' "$crate/Cargo.toml" | cut -d'"' -f2)
            version=$(grep -m1 '^version = ' "$crate/Cargo.toml" | cut -d'"' -f2)
            if curl -sf -A "maplibre-rust-ui release" "https://crates.io/api/v1/crates/$name/$version" > /dev/null; then
              echo "$name $version is on crates.io already"
              continue
            fi
            (cd "$crate" && cargo publish)
            git tag "$name-v$version"
            git push origin "$name-v$version"
          done

  npm:
    name: Publish on npm
    # The package's crate takes the core from crates.io.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5.1 or later.
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Stage
        working-directory: exact/package
        env:
          # The first version only, before npm has the package to trust this workflow for.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ -n "$(npm view "maplibre-exact@$version" version 2> /dev/null)" ]; then
            echo "maplibre-exact $version is on npm already"
            exit 0
          fi
          npm stage publish . --provenance --access public
          git tag "maplibre-exact-v$version"
          git push origin "maplibre-exact-v$version"
