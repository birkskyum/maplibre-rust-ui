[package]
name = "hello-map-ferroui"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "A FerroUI app with a MapLibre map"
publish = false

[dependencies]
ferroui-base = "0.5.0"
ferroui-controls = "0.5.0"
ferroui-view = { version = "0.5.0", features = ["desktop"] }
maplibre-ferroui = { path = "../.." }
serde_json = "1"

# The walk runs the app in a window out of sight, as Hello Map's main does
# but without a frame, focus or Dock icon.
[[test]]
name = "walk"
harness = false

[dev-dependencies]
ferroui-desktop = "0.5.0"
ferroui-themes-fluent = "0.5.0"

[target.'cfg(target_os = "macos")'.dev-dependencies]
ferroui-native = "0.5.0"
