[package]
name = "maplibre-rust-ui"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "MapLibre maps for Rust UI frameworks, declared once and drawn by mln-rs"
repository = "https://github.com/birkskyum/maplibre-rust-ui"
homepage = "https://birkskyum.github.io/maplibre-rust-ui/"
documentation = "https://birkskyum.github.io/maplibre-rust-ui/api/maplibre_rust_ui/"
readme = "README.md"
keywords = ["maplibre", "map", "gis", "vector-tiles", "gui"]
categories = ["gui", "science::geo", "rendering"]

# Its own workspace, so that its tests build it alone.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

feature = { package = "mln-rs-feature", path = "../../mln-rs/vendor/feature", version = "0.0.18" }
# With its font-face shaper, which the runtime's renderer then has, and the
# SQLite cache and offline regions.
mln_engine = { package = "mln-rs-engine", path = "../../mln-rs/crates/mln_engine", version = "0.0.18", default-features = false, features = ["font-face-shaper", "sqlite"] }
# For the size of the textures the session renders into.
mln_gfx = { package = "mln-rs-gfx", path = "../../mln-rs/crates/mln_gfx", version = "0.0.18" }
mln_runtime = { package = "mln-rs-runtime", path = "../../mln-rs/crates/mln_runtime", version = "0.0.18", default-features = false, features = ["webgpu"] }
mln_style = { package = "mln-rs-style", path = "../../mln-rs/crates/mln_style", version = "0.0.18" }
mln_webgpu = { package = "mln-rs-webgpu", path = "../../mln-rs/crates/mln_webgpu", version = "0.0.18" }
# mln-rs's, which hosts that draw with wgpu share.
wgpu = { version = "30.0.1", default-features = false }

[features]
# mln-rs's Metal backend, whose maps render into IOSurfaces that a host draws.
metal = ["mln_runtime/metal"]

[target.'cfg(target_os = "android")'.dependencies]
# To ask the app's context for its cache directory.
jni = { version = "0.22.4", default-features = false }
raw-window-handle = "0.6.2"
# For the storage's and the system fonts' Android setup, which needs the app's
# Java VM and context.
mln_engine = { package = "mln-rs-engine", path = "../../mln-rs/crates/mln_engine", version = "0.0.18", default-features = false, features = ["system-fonts"] }
